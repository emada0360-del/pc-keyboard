name: Build PC Keyboard APK
on:
  workflow_dispatch:
  push:
    paths: ['pc-keyboard.zip', '.github/workflows/pc-keyboard.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o pc-keyboard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: pc-keyboard
      - run: cp pc-keyboard/app/build/outputs/apk/debug/app-debug.apk PCKeyboard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-keyboard-latest
          name: PC Keyboard APK
          files: PCKeyboard.apk
          prerelease: true
